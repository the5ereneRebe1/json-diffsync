<svg viewBox="0 0 820 470" width="820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Without diff sync a stale laptop overwrites newer work; with json-diffsync it sends an empty patch and gets the missing changes back.</title>
  <style>
    :root { --text:#1f2328; --muted:#59636e; --line:#818b98; --box:#f6f8fa; --stroke:#d1d9e0; --blue:#0969da; --green:#1a7f37; --red:#cf222e; --amber:#9a6700; }
    @media (prefers-color-scheme: dark) {
      :root { --text:#e6edf3; --muted:#9198a1; --line:#767e89; --box:#151b23; --stroke:#3d444d; --blue:#4493f8; --green:#3fb950; --red:#f85149; --amber:#d29922; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: var(--text); }
    .h { font-weight: 700; font-size: 14px; }
    .muted { fill: var(--muted); }
    .red { fill: var(--red); }
    .green { fill: var(--green); }
    .blue { fill: var(--blue); }
    .small { font-size: 12px; }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; rx: 8; }
    .wire { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .wire-red { stroke: var(--red); stroke-width: 1.5; fill: none; }
    .wire-green { stroke: var(--green); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="aL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--red)"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--green)"/>
    </marker>
  </defs>

  <!-- Panel 1: without diff sync -->
  <text x="20" y="28" class="h red">WITHOUT diff sync</text>
  <text x="183" y="28" class="muted">— the stale tab strikes at 3 p.m.</text>

  <text x="30" y="58" class="muted small">laptop · idle since lunch</text>
  <rect x="20" y="68" width="255" height="74" class="box"/>
  <text x="38" y="98">{ title: "v1",</text>
  <text x="38" y="120">  blocks: [ 3 items ] }</text>

  <line x1="285" y1="105" x2="530" y2="105" class="wire-red" marker-end="url(#aR)"/>
  <text x="345" y="96" class="red small">PUT full document</text>

  <text x="555" y="58" class="muted small">server</text>
  <rect x="545" y="68" width="255" height="74" class="box"/>
  <text x="563" y="98">{ title: "v1",</text>
  <text x="563" y="120">  blocks: [ 3 items ] }</text>

  <text x="545" y="170" class="red">✗ silently erased the 47 blocks</text>
  <text x="563" y="190" class="red">written on the iPad</text>

  <line x1="20" y1="218" x2="800" y2="218" stroke="var(--stroke)" stroke-width="1"/>

  <!-- Panel 2: with json-diffsync -->
  <text x="20" y="252" class="h green">WITH json-diffsync</text>
  <text x="190" y="252" class="muted">— a stale client has nothing to say</text>

  <text x="30" y="282" class="muted small">laptop · still stale, still safe</text>
  <rect x="20" y="292" width="255" height="96" class="box"/>
  <text x="38" y="322">value == shadow</text>
  <text x="38" y="346" class="muted">no local edits since the</text>
  <text x="38" y="364" class="muted">last time we agreed</text>

  <text x="555" y="282" class="muted small">server</text>
  <rect x="545" y="292" width="255" height="96" class="box"/>
  <text x="563" y="322">canonical: 47 blocks</text>
  <text x="563" y="346" class="muted">written on the iPad,</text>
  <text x="563" y="364" class="muted">all of them kept</text>

  <line x1="285" y1="318" x2="530" y2="318" class="wire" marker-end="url(#aL)"/>
  <text x="330" y="309" class="blue small">sync · patch { ops: [] }</text>

  <line x1="530" y1="362" x2="285" y2="362" class="wire-green" marker-end="url(#aG)"/>
  <text x="306" y="382" class="green small">reply: the 47 blocks the laptop missed</text>

  <text x="20" y="436" class="muted">nobody loses work for having an old tab open</text>
</svg>
