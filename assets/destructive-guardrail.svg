<svg viewBox="0 0 820 330" width="820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">A patch that deletes most of the document is applied only when confirmDestructive is set; otherwise the server rejects it and asks for confirmation.</title>
  <style>
    :root { --text:#1f2328; --muted:#59636e; --line:#818b98; --box:#f6f8fa; --stroke:#d1d9e0; --blue:#0969da; --green:#1a7f37; --red:#cf222e; --amber:#9a6700; }
    @media (prefers-color-scheme: dark) {
      :root { --text:#e6edf3; --muted:#9198a1; --line:#767e89; --box:#151b23; --stroke:#3d444d; --blue:#4493f8; --green:#3fb950; --red:#f85149; --amber:#d29922; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: var(--text); }
    .b { font-weight: 700; }
    .muted { fill: var(--muted); }
    .green { fill: var(--green); }
    .red { fill: var(--red); }
    .small { font-size: 12px; }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; rx: 8; }
    .box-green { fill: var(--box); stroke: var(--green); stroke-width: 1.5; rx: 8; }
    .box-red { fill: var(--box); stroke: var(--red); stroke-width: 1.5; rx: 8; }
    .wire { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .wire-green { stroke: var(--green); stroke-width: 1.5; fill: none; }
    .wire-red { stroke: var(--red); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="aL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--green)"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--red)"/>
    </marker>
  </defs>

  <rect x="220" y="20" width="380" height="44" class="box"/>
  <text x="244" y="47">patch deletes ≥ 80% of the document</text>

  <line x1="410" y1="64" x2="410" y2="100" class="wire" marker-end="url(#aL)"/>

  <rect x="250" y="104" width="320" height="44" class="box"/>
  <text x="274" y="131">meta.confirmDestructive<tspan class="muted"> === true ?</tspan></text>

  <path d="M 410 148 L 410 172 L 200 172 L 200 196" class="wire-green" marker-end="url(#aG)"/>
  <text x="166" y="190" class="green b">yes</text>

  <path d="M 410 148 L 410 172 L 620 172 L 620 196" class="wire-red" marker-end="url(#aR)"/>
  <text x="638" y="190" class="red b">no</text>

  <rect x="80" y="202" width="240" height="70" class="box-green"/>
  <text x="100" y="231" class="green b">applied</text>
  <text x="100" y="255" class="muted small">+ revision recorded</text>

  <rect x="420" y="202" width="380" height="70" class="box-red"/>
  <text x="440" y="231" class="red b">rejected · 409</text>
  <text x="440" y="255" class="small">destructive_patch_requires_confirmation</text>

  <text x="20" y="312" class="muted small">shrinkage is measured against the server's own shadow — a broken client cannot understate a delete</text>
</svg>
